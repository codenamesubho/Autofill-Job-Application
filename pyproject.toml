[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autofill-job-application"
version = "0.1.0"
description = "Navigates to job applications and snapshots their questions. Never submits."
requires-python = ">=3.11"
dependencies = [
    "browser-use>=0.13.8",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[project.scripts]
autofill-snapshot = "autofill_job_application.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires a real browser and network access (deselect with '-m \"not live\"')",
]
addopts = "-m 'not live'"
